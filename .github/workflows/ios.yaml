name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_ios:
    # A macOS runner is mandatory to compile iOS applications
    runs-on: macos-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java environment (Required by Flutter SDK)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Cache and Set up Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Optional: cache: true

      # Step 4: Install Flutter Dart package dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 5: Install iOS native Pod dependencies
      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      # Step 6: Compile the iOS App without code signing
      - name: Build iOS Application
        run: flutter build ios --release --no-codesign

      # Step 7: (Optional) Compress the app bundle into an unsigned .zip artifact
      - name: Compress Build Artifact
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r Payload.ipa Payload

      # Step 8: Upload the compiled bundle back to GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios build
          path: build/ios/iphoneos/Payload.ipa
